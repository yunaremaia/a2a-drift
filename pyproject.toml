[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-drift"
version = "0.1.0"
description = "Detect A2A (Agent2Agent) protocol compliance drift — agent cards, endpoints, spec versions, JSON-RPC conformance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Yunare Maia", email = "yunare@gmail.com"}]
dependencies = [
    "httpx>=0.27",
]

# The declared development setup. Before this existed, `pip install -e ".[dev]"`
# installed nothing beyond the package: pip only *warns* on an unknown extra
# and still exits 0, so the documented command looked like it worked and left a
# contributor with no pytest, no ruff and no mypy. CI hid the gap by naming the
# tools in its own install steps.
#
# The floors are the lowest versions that run this repository's checks, not the
# newest ones: pytest 7 is the first with the `testpaths`/`addopts` ini options
# used here, pytest-cov 4 reports the coverage this project gates on, and ruff
# 0.6 is the first release where `[tool.ruff.lint]` nests the selection that
# `[tool.ruff]` previously read. `test_packaging.py` fails if CI starts
# installing a tool this extra does not declare, so the two cannot drift apart.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
]

[project.scripts]
a2a-drift = "a2a_drift.cli:main"

[tool.setuptools.packages.find]
include = ["a2a_drift*"]

# Quality gates for issue #16.
#
# Rule selection is deliberate, not "enable everything and silence the noise".
# The six families below each catch a class of real defect in this codebase:
#   E, F  pycodestyle errors + pyflakes (undefined/unused names) — baseline.
#   I     import sorting, so the import block stops depending on who edited it.
#   B     bugbear: the mutable-default and shadowed-loop-var class of mistakes.
#   UP    pyupgrade: modern syntax the declared >=3.9 floor already allows.
#   SIM   flake8-simplify: collapsible branches and redundant nesting.
# Anything that would be pure churn for a codebase this size stays off rather
# than being enabled and then ignored file by file.
[tool.ruff]
# 3.9 is the floor declared in requires-python, and CI tests it. Pinning the
# target here is what stops UP007/UP045 from rewriting `Optional[str]` into
# `str | None`, which is a runtime TypeError on 3.9 (PEP 604 landed in 3.10).
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SIM117 wants nested `with` blocks combined into one. Doing that requires
# parenthesised context managers, which are a 3.10+ syntax and this package
# still supports 3.9, so the rule is unenforceable here rather than merely
# noisy. Applies to the test suite only; library code is not exempt.
"tests/**" = ["SIM117"]

[tool.ruff.format]
docstring-code-format = true

# Type gate for issue #16.
#
# The issue proposed `strict = false` and "a few errors for legacy code". That
# is how a type gate dies: a job that is expected to fail gets ignored, then
# deleted. Instead this enables the checks that are achievable on a
# 700-line package that is already fully annotated — the three missing return
# annotations it surfaced were fixed in the same change — while leaving
# `disallow_any_explicit`/`strict` off, which would flag the deliberate
# `Optional[bool]` tri-state on ValidationResult and the dynamic JSON parsing
# that the whole tool is built on.
[tool.mypy]
# `python_version` is intentionally not pinned: mypy 2.x refuses anything
# below 3.10, while this package supports 3.9. Pinning it to the lowest
# version mypy accepts would mean the gate checks 3.10 semantics and calls
# that 3.9 coverage, which is worse than checking the interpreter's own
# version honestly. The 3.9 floor is enforced where it actually matters — by
# the pytest matrix leg in CI.
files = ["a2a_drift"]
# Disallow untyped defs. Every function in the package is annotated, and the
# gate is what keeps it that way as new code lands.
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Catch the silent-failure modes: a redundant cast hides a type error, an
# unused ignore means the type it silenced has changed.
warn_redundant_casts = true
warn_unused_ignores = true
# No implicit Optional: `def f(x: int = None)` is an error, not a shrug.
no_implicit_optional = true
# 1 == True must be a deliberate, visible decision.
strict_equality = true
# Report the error only; the CI step is the gate, local runs are for humans.
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated unit tests",
    "slow: tests that make real network calls",
]

# The coverage floor is a single source of truth for both local runs and CI:
# pytest-cov reads it from here, so a local `pytest --cov=a2a_drift` fails
# exactly like CI does.
#
# 100 is not aspirational, it is enforced. coverage's fail_under compares the
# total rounded to whole percent, so a lower value (e.g. 99) would let a real
# 99.5% total pass. 100 additionally special-cases "must be exactly 100", which
# is what makes the gate strict rather than advisory. Every statement in
# a2a_drift is covered by a test, so nothing is being hidden from this number.
[tool.coverage.run]
source = ["a2a_drift"]

[tool.coverage.report]
fail_under = 100
show_missing = true

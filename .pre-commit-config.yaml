# Quality gates for issue #16.
#
# CI is the enforcing gate; this file exists so the same rules run before a
# commit is created, which is cheaper than finding out from a red check. Rule
# selection lives in pyproject.toml ([tool.ruff] and [tool.mypy]) so there is
# exactly one place to change it — these hooks only decide when to invoke it.
#
#   pre-commit install   # once per clone
#
# Note: the mypy hook is not mirrored from a local environment, so it resolves
# its own pinned interpreter and cannot silently check a different Python than
# the one the pre-commit virtualenv was built against.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Lint first: autofixes that the formatter would then have to undo are
      # better resolved before formatting runs.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        # `files` in [tool.mypy] already scopes this to the package; passing
        # the directory again would make mypy re-resolve it per-file. Types
        # are installed up front via additional_dependencies, so the hook has
        # no reason to try installing them itself and fail on a network hiccup.
        args: [--no-install-types]
        files: ^a2a_drift/
        additional_dependencies: [httpx>=0.27]

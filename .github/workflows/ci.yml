name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject.toml and is tested on purpose:
        # an untested floor is exactly how requires-python drifts out of sync
        # with the code. test_packaging.py fails if these two fall out of step.
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov

      # Coverage is enforced from pyproject.toml ([tool.coverage.report]
      # fail_under), so a local `pytest --cov=a2a_drift` and this job share one
      # threshold. Do not move the number into a --cov-fail-under flag here:
      # that would let the local and CI gates drift apart.
      - name: Run tests with coverage
        run: python -m pytest -q --cov=a2a_drift --cov-report=term-missing

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      # Reads [tool.ruff] from pyproject.toml. Do not re-pass --isolated with a
      # hand-written --select here: that made this job a second, silent source
      # of truth for which rules are enforced, and it silently disagreed with
      # what contributors get from a bare `ruff check .`.
      - name: Run ruff
        run: ruff check --output-format=github .

      # Formatting is a separate step from linting on purpose: `ruff check
      # --fix` can resolve findings in a way the formatter would re-flag, so
      # running them in that order keeps the two from fighting each other.
      - name: Check formatting
        run: ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: python -m pip install mypy

      # The package is installed (not just type-checked in place) so that httpx
      # resolves from site-packages and mypy checks real import resolution
      # rather than guessing at a missing dependency.
      - name: Install package
        run: python -m pip install -e .

      # `files` and the flags come from [tool.mypy]; the only thing passed here
      # is the config path, so local `mypy` and CI run identical settings.
      - name: Run mypy
        run: mypy --config-file pyproject.toml
